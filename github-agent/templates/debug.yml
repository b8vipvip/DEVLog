name: Debug - One Shot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-one-shot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Diagnostic command
        run: |
          echo 'Replace with a bounded diagnostic command.'
          echo 'Do not add push, pull_request, or schedule triggers to this workflow.'
