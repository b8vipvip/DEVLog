name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # High-frequency PRs keep only the newest SHA. A validation already running on
  # the default branch is allowed to finish instead of being killed by a new push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-gate:
    name: Fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Add runtime setup here, for example setup-python@v7 / setup-node@v7.
      - name: Syntax, lint, compile, and focused contracts
        run: |
          echo 'Replace with fast deterministic checks.'

  full-test:
    name: Full test suite
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run full tests
        run: |
          # Python example:
          # python -m pip install -r requirements.txt pytest-timeout
          # pytest -q --timeout=120
          # Node example:
          # npm ci
          # npm test
          echo 'Replace with project full tests.'
