name: CI

on:
  pull_request:
  push:
    branches:
      - main

# PR 连续提交时，只保留当前 PR 的最新一次 CI。
# main 上的正式 CI 不会被后续提交强制取消。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Python ----------
      - name: Setup Python
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements-dev.txt') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements-dev.txt') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Python compile
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements-dev.txt') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q . \
            -x '(^|/)(\.git|\.venv|venv|node_modules|dist|build)(/|$)'

      - name: Python tests
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          if python -c "import pytest" >/dev/null 2>&1; then
            # CI 总超时之外，再给 pytest 单独加硬超时，避免死锁无限挂住。
            timeout --signal=TERM --kill-after=15s 900s \
              python -m pytest -q --maxfail=1
          else
            echo "pytest 未安装，跳过 Python tests。请按项目需要修改本步骤。"
          fi

      # ---------- Node.js ----------
      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Node.js dependencies
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Node.js tests
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            timeout --signal=TERM --kill-after=15s 900s npm test
          else
            echo "package.json 未定义 test 脚本，跳过 Node.js tests。"
          fi
