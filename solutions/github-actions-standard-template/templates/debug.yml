name: Manual Debug

# 临时调试 Workflow 只能手动触发。
# 禁止长期对 feature/fix 分支使用 push 自动触发。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '选择调试模式'
        required: true
        default: 'python'
        type: choice
        options:
          - python
          - node

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        if: ${{ inputs.mode == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python debug
        if: ${{ inputs.mode == 'python' }}
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi

          if python -c "import pytest" >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=10s 300s \
              python -m pytest -vv -s --maxfail=20
          else
            echo "pytest 未安装。"
            exit 1
          fi

      - name: Setup Node.js
        if: ${{ inputs.mode == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node debug
        if: ${{ inputs.mode == 'node' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          timeout --signal=TERM --kill-after=10s 300s npm test
