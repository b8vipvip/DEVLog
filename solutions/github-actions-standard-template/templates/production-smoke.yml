name: Production Smoke

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'src/**'
      - 'app/**'
      - 'server/**'
      - 'scripts/**'
      - 'chrome_extension/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/production-smoke.yml'
  push:
    branches:
      - main

# 重型 Smoke 同样只保留 PR 最新版本；main 正式验证不强制取消。
concurrency:
  group: smoke-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker production smoke
        if: ${{ hashFiles('Dockerfile') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          docker build -t project-production-smoke .

          # 在这里加入“真实生产镜像”的最小启动/健康检查。
          # 示例：
          #
          # cid="$(docker run -d -p 127.0.0.1:18080:8080 project-production-smoke)"
          # trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          # for _ in $(seq 1 30); do
          #   if curl -fsS --max-time 2 http://127.0.0.1:18080/health; then
          #     exit 0
          #   fi
          #   sleep 1
          # done
          # exit 1

          echo "Docker 镜像构建成功。请按项目补充启动与健康检查。"

      - name: No Dockerfile
        if: ${{ hashFiles('Dockerfile') == '' }}
        run: echo "当前项目没有 Dockerfile；请按项目类型改造 production-smoke.yml。"
