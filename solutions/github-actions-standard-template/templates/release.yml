name: Release

on:
  # 推荐：正式发布由明确事件触发，而不是每次 PR 都执行。
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Release 属于共享生产资源：同一时间只允许一条发布流水线。
# 不自动取消已经开始的发布，避免 Tag / Release / Artifact 出现半成品状态。
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          echo "Release ref: $GITHUB_REF"
          echo "Release SHA: $GITHUB_SHA"

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "TODO: 在这里放正式打包命令。"
          echo "不要让多个 Workflow 同时修改同一 Tag / Release / 正式 Artifact。"

      # 建议使用 softprops/action-gh-release 或 gh release，
      # 但请在项目确定产物后再启用，避免模板误发正式版本。
