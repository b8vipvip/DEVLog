name: Actions Recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id: { description: Source workflow run ID, required: true, type: string }
      source_workflow_id: { description: Source workflow ID, required: true, type: string }
      source_workflow_name: { description: Source workflow name, required: true, type: string }
      source_branch: { description: Source branch, required: false, type: string }
      source_head_sha: { description: Source head SHA, required: true, type: string }
      source_event: { description: Source event, required: false, type: string }
      source_workflow_path: { description: Source workflow path, required: false, type: string }
      source_run_attempt: { description: Source run attempt, required: false, default: '1', type: string }
      recovery_reason: { description: Recovery reason, required: true, type: string }

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: actions-recovery-${{ inputs.source_workflow_id }}-${{ inputs.source_run_id }}
  cancel-in-progress: true

jobs:
  recover:
    name: Repair and resubmit abnormal workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_head_sha }}
          fetch-depth: 0

      - name: Collect evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW_PATH: ${{ inputs.source_workflow_path }}
        run: |
          set -Eeuo pipefail
          mkdir -p .actions-recovery
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > .actions-recovery/run.json
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > .actions-recovery/source.log 2>&1 || true
          workflow_path="$SOURCE_WORKFLOW_PATH"
          [[ -z "$workflow_path" ]] && workflow_path="$(jq -r '.path // ""' .actions-recovery/run.json)"
          echo "workflow_path=$workflow_path" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$(jq -r '.run_attempt // 1' .actions-recovery/run.json)" >> "$GITHUB_OUTPUT"
          echo "default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')" >> "$GITHUB_OUTPUT"

      - name: Load latest repair logic from default branch
        env:
          DEFAULT_BRANCH: ${{ steps.evidence.outputs.default_branch }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git show "origin/$DEFAULT_BRANCH:.github/scripts/actions_strategy_autofix.py" > /tmp/actions_strategy_autofix.py
          if git cat-file -e "origin/$DEFAULT_BRANCH:.github/actions-recovery.sh" 2>/dev/null; then
            git show "origin/$DEFAULT_BRANCH:.github/actions-recovery.sh" > /tmp/actions-recovery.sh
            chmod +x /tmp/actions-recovery.sh
          fi

      - name: Apply safe automatic repair
        id: repair
        env:
          ACTIONS_RECOVERY_LOG: ${{ github.workspace }}/.actions-recovery/source.log
          WORKFLOW_PATH: ${{ steps.evidence.outputs.workflow_path }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW_NAME: ${{ inputs.source_workflow_name }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
        run: |
          set -Eeuo pipefail
          repaired=false
          if [[ -n "$WORKFLOW_PATH" && -f "$WORKFLOW_PATH" ]]; then
            before="$(git status --porcelain)"
            python /tmp/actions_strategy_autofix.py "$WORKFLOW_PATH"
            [[ "$(git status --porcelain)" != "$before" ]] && repaired=true
          fi
          if [[ -f /tmp/actions-recovery.sh ]]; then
            before="$(git status --porcelain)"
            bash /tmp/actions-recovery.sh
            [[ "$(git status --porcelain)" != "$before" ]] && repaired=true
          fi
          echo "repaired=$repaired" >> "$GITHUB_OUTPUT"

      - name: Submit recovery branch and PR
        if: steps.repair.outputs.repaired == 'true'
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          DEFAULT_BRANCH: ${{ steps.evidence.outputs.default_branch }}
        run: |
          set -Eeuo pipefail
          repair_branch="actions-recovery/run-${SOURCE_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$repair_branch"
          git add -A
          git reset -- .actions-recovery 2>/dev/null || true
          git commit -m "ci(recovery): repair Actions run ${SOURCE_RUN_ID}"
          git push --force origin "HEAD:${repair_branch}"
          base="$SOURCE_BRANCH"; [[ -z "$base" ]] && base="$DEFAULT_BRANCH"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$repair_branch" --state open --json url --jq '.[0].url // ""')"
          if [[ -z "$pr" ]]; then
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$base" --head "$repair_branch" --title "ci(recovery): repair abnormal Actions run ${SOURCE_RUN_ID}" --body "Automated GitHub Actions Strategy v3 recovery for run ${SOURCE_RUN_ID}.")"
          fi
          echo "repair_ref=$repair_branch" >> "$GITHUB_OUTPUT"
          echo "repair_pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Classify side effects
        id: classify
        env:
          WORKFLOW_NAME: ${{ inputs.source_workflow_name }}
        run: |
          lower="$(tr '[:upper:]' '[:lower:]' <<<"$WORKFLOW_NAME")"
          side_effectful=false
          if [[ "$lower" == *release* || "$lower" == *deploy* || "$lower" == *publish* || "$lower" == *store*package* ]]; then side_effectful=true; fi
          echo "side_effectful=$side_effectful" >> "$GITHUB_OUTPUT"

      - name: Redispatch repaired ordinary workflow
        if: steps.repair.outputs.repaired == 'true' && steps.classify.outputs.side_effectful != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: ${{ inputs.source_workflow_id }}
          REPAIR_REF: ${{ steps.submit.outputs.repair_ref }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/dispatches" -f ref="$REPAIR_REF"

      - name: Retry transient run once
        if: steps.repair.outputs.repaired != 'true' && steps.classify.outputs.side_effectful != 'true'
        id: retry
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RUN_ATTEMPT: ${{ steps.evidence.outputs.run_attempt }}
        run: |
          if (( RUN_ATTEMPT >= 2 )); then echo "retry_exhausted=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/rerun" >/dev/null
          echo "retry_exhausted=false" >> "$GITHUB_OUTPUT"

      - name: Open recovery incident when bounded automation ends
        if: steps.classify.outputs.side_effectful == 'true' || steps.retry.outputs.retry_exhausted == 'true' || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW_NAME: ${{ inputs.source_workflow_name }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
        run: |
          title="[Actions Recovery] ${SOURCE_WORKFLOW_NAME} run ${SOURCE_RUN_ID}"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Automatic Strategy v3 recovery reached a safety boundary. Source run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}. Reason: ${RECOVERY_REASON}."
